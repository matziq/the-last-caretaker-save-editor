name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86
            platform: Win32
            bits: 32
          - architecture: x64
            platform: Win64
            bits: 64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.21.0 pyinstaller-hooks-contrib==2026.9

      - name: Verify Python architecture
        run: |
          python -c "import struct; bits=struct.calcsize('P')*8; print(bits); assert bits == ${{ matrix.bits }}"

      - name: Check executable settings behavior
        run: |
          python -m unittest test_last_caretaker_save_edit.FrozenSettingsPathTests
          python -m py_compile last_caretaker_save_gui.py test_last_caretaker_save_edit.py

      - name: Build self-contained executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TheLastCaretakerSaveEditor-${{ matrix.platform }}
          --add-data "named_locations.json;."
          --hidden-import ooz
          last_caretaker_save_gui.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheLastCaretakerSaveEditor-${{ matrix.platform }}
          path: dist/TheLastCaretakerSaveEditor-${{ matrix.platform }}.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/TheLastCaretakerSaveEditor-Win32.exe
          release/TheLastCaretakerSaveEditor-Win64.exe
          --repo "${{ github.repository }}"
          --title "The Last Caretaker Save Editor ${{ github.ref_name }}"
          --generate-notes
