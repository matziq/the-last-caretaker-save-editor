name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.21.0 pyinstaller-hooks-contrib==2026.9

      - name: Check executable settings behavior
        run: |
          python -m unittest test_last_caretaker_save_edit.FrozenSettingsPathTests
          python -m py_compile last_caretaker_save_gui.py test_last_caretaker_save_edit.py

      - name: Build self-contained executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TheLastCaretakerSaveEditor
          --add-data "named_locations.json;."
          --hidden-import ooz
          last_caretaker_save_gui.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/TheLastCaretakerSaveEditor.exe"
          --repo "${{ github.repository }}"
          --title "The Last Caretaker Save Editor ${{ github.ref_name }}"
          --generate-notes
